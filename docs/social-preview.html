<!doctype html>
<!-- Source of docs/social-preview.png (1280×640). Regenerate:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
       --window-size=1280,640 --screenshot=docs/social-preview.png docs/social-preview.html -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: #0d1117; color: #e6edf3;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    display: flex; flex-direction: column; padding: 56px 80px 48px; box-sizing: border-box;
  }
  .title { font-size: 88px; font-weight: 800; letter-spacing: -2px; }
  .title span { color: #00c2b8; }
  .sub { font-size: 34px; color: #9da7b3; margin-top: 8px; }
  .term {
    margin-top: 36px; background: #161b22; border: 1px solid #30363d; border-radius: 14px;
    padding: 28px 36px; font-family: "SF Mono", Menlo, monospace; font-size: 25px; line-height: 1.55;
  }
  .term div { white-space: pre; }
  .p { color: #7ee787; }
  .dim { color: #8b949e; }
  .hl { color: #00c2b8; font-weight: 700; }
  .foot { margin-top: auto; font-size: 24px; color: #8b949e; }
</style>
</head>
<body>
  <div class="title">tsrs<span>-doctor</span></div>
  <div class="sub">tsgo vs tsrs on your own TypeScript 7 repo</div>
  <div class="term">
    <div><span class="p">$</span> bunx tsrs-doctor</div>
    <div class="dim">tsgo   7.17s   7562 MiB</div>
    <div class="dim">tsrs   2.29s   1881 MiB</div>
    <div>diagnostics: same 0, missing 0, extra 0, text differs 0</div>
    <div class="hl">tsrs is 3.1× faster and uses 4.0× less memory, identical diagnostics</div>
  </div>
  <div class="foot">github.com/majiayu000/tsrs-doctor · type-fest, Apple Silicon</div>
</body>
</html>
